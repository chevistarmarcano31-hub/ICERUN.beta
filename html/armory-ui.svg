    <text x="1225" y="637" text-anchor="middle" fill="#bdfbc9" font-size="13">CAMISA</text><text x="1328" y="637" text-anchor="middle" fill="#bdfbc9" font-size="13">PANTALÓN</text><text x="1431" y="637" text-anchor="middle" fill="#bdfbc9" font-size="13">CASCO</text>
    <text x="1175" y="680" fill="#7bc892" font-size="24">‹</text><text x="1500" y="680" fill="#7bc892" font-size="24">›</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Armería y habilidades</title>
  <desc id="desc">Interfaz futurista verde para personalización de armas, habilidades y skin.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#06130f"/>
      <stop offset=".5" stop-color="#102c22"/>
      <stop offset="1" stop-color="#030806"/>
    </linearGradient>
    <radialGradient id="mist" cx=".5" cy=".45" r=".7">
      <stop stop-color="#5a9c70" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#183c2b" stop-opacity=".2"/>
      <stop offset="1" stop-color="#020604" stop-opacity=".85"/>
    </radialGradient>
    <linearGradient id="panel" y2="1">
      <stop stop-color="#1b4b37" stop-opacity=".82"/>
      <stop offset="1" stop-color="#07150f" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="yellow" y2="1">
      <stop stop-color="#fff28a"/>
      <stop offset=".45" stop-color="#ffd33d"/>
      <stop offset="1" stop-color="#b87508"/>
    </linearGradient>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7ee0a4" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#mist)"/>
  <ellipse cx="1060" cy="420" rx="480" ry="230" fill="#6ed693" opacity=".12" filter="url(#softGlow)"/>
  <ellipse cx="270" cy="730" rx="390" ry="170" fill="#80d89e" opacity=".1" filter="url(#softGlow)"/>
  <g fill="#b9ffd0">
